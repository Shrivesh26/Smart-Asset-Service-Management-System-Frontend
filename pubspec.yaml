name: smart_asset_service
description: Smart Asset & Service Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # HTTP & Networking
  http: ^1.2.1

  # Local Storage
  shared_preferences: ^2.2.3

  # Navigation
  go_router: ^13.2.0

  # UI Components
  cupertino_icons: ^1.0.6
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Date & Time Formatting
  intl: ^0.19.0

  # Image Picker
  image_picker: ^1.1.2
  dio: ^5.4.0

  # Unique IDs
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
